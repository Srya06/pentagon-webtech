<!DOCTYPE html>
<html>
<head>
    <title>Input Attributes</title>
</head>
<body>

<h2>HTML Input Attributes</h2>

1. Value
<input value="Surya">
<br><br>

2. Placeholder
<input placeholder="Enter name">
<br><br>

3. Required
<input required>
<br><br>

4. Disabled
<input disabled>
<br><br>

5. Checked
<input type="checkbox" checked>
<br><br>

6. ID
<input id="student">
<br><br>

7. Name
<input name="username">
<br><br>

8. Hidden
<input type="hidden" value="100">
<br><br>

9. Size
<input size="10">
<br><br>

10. Maxlength
<input maxlength="5">
<br><br>

11. Minlength
<input minlength="3">
<br><br>

12. Readonly
<input value="Student" readonly>
<br><br>

13. Autofocus
<input autofocus>
<br><br>

14. Autocomplete
<input autocomplete="on">
<br><br>

15. Title
<input title="Enter your name">
<br><br>

</body>
</html>
