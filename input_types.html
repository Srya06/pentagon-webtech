<!DOCTYPE html>
<html>
<head>
    <title>Input Types</title>
</head>
<body>

<h2>HTML Input Types</h2>

1. Text
<input type="text">
<br><br>

2. Password
<input type="password">
<br><br>

3. Number
<input type="number">
<br><br>

4. Telephone
<input type="tel">
<br><br>

5. URL
<input type="url">
<br><br>

6. Date
<input type="date">
<br><br>

7. Time
<input type="time">
<br><br>

8. Month
<input type="month">
<br><br>

9. File
<input type="file">
<br><br>

10. Range
<input type="range">
<br><br>

11. Checkbox
<input type="checkbox"> HTML
<input type="checkbox"> Python
<br><br>

12. Radio
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<br><br>

13. Email
<input type="email">
<br><br>

14. Submit
<input type="submit">
<br><br>

15. Search
<input type="search">
<br><br>

16. Select
<select>
    <option>BCA</option>
    <option>B.Tech</option>
</select>
<br><br>

17. Textarea
<textarea></textarea>
<br><br>

18. Reset
<input type="reset">

</body>
</html>
